; tox.ini file for Tox https://tox.wiki/en/latest/config.html

; To perform the same tests done in GitHub Actions by CI-CD but locally (i.e. before pushing), run $ tox --parallel

; At its core tox provides a convenient way to run arbitrary commands in isolated environments to serve as a single
; entry point for build, test and release activities.

; May be run in parallel:
; > tox -p


;  #### REMINDER: will not work if UV_SYSTEM_PYTHON is set!
; PS > Remove-Item Env:\UV_SYSTEM_PYTHON && tox -p
; > set UV_SYSTEM_PYTHON= && tox

[tox]
requires =
    tox >= 4.61.2
    tox-uv-bare >= 1.36.0
env_list =
    # NOTE: the py factors below must stay in sync with the generative [testenv:py{...}-*] section names further down
    pre-commit
    py{315, 314, 311}-new-install  # We install it for the current and lowest version we support
    py{315, 314, 313, 312, 311}-pytest
    ; post
skip_missing_interpreters = true

[testenv]
; Settings defined here are automatically inherited by individual environments unless overridden
; To run a single environment: > tox -e py313-pytest
parallel_show_output = true
set_env =
    PRE_COMMIT_COLOR = always
    UV_SYSTEM_PYTHON = 0
    PYTEST_ADDOPTS = --color=yes
    PYTHONPATH = {toxinidir}
    PYTHONUTF8 = 1
    USERPROFILE = {env:TEMP:{env_tmp_dir}}
    # The USERPROFILE redirect above would otherwise land virtualenv's seed-wheel cache inside TEMP, where
    # Windows temp cleanup guts it (empties the pip image files, keeps the dirs); virtualenv then trusts the
    # hollow image and seeds hook venvs with a pip missing __main__. Keep the cache in .tox/ instead.
    VIRTUALENV_APP_DATA = {work_dir}/.virtualenv_app_data

[pkgenv]
set_env =
    UV_SYSTEM_PYTHON = 0

[testenv:pre-commit]
# Settings defined in the top-level testenv section are automatically inherited if not overwritten
description = Run pre-commit
deps =
    -rtests/requirements_pre-commit.txt
# NOTE: autoupdate lists its repos explicitly because it has no exclude flag, only the --repo allowlist.
# gitleaks is deliberately left out: its v8.30.1 hotfix was tagged off a branch that diverged from the
# project's default branch (master), which is the only place autoupdate looks, so a bare autoupdate
# silently downgrades the pin to the older v8.30.0 on every run. Bump gitleaks by hand.
# Adding a new repo to .pre-commit-config.yaml means adding it here too, or it will never be updated.
commands =
    pre-commit autoupdate \
        --repo https://github.com/pre-commit/pre-commit-hooks \
        --repo https://github.com/pre-commit/pygrep-hooks \
        --repo https://github.com/rstcheck/rstcheck
    pre-commit run --all-files --show-diff-on-failure
temp_dir = {work_dir}/.tmp_pre-commit
# skip_install = true

[testenv:py{315, 314, 311}-new-install]
# Settings defined in the top-level testenv section are automatically inherited if not overwritten
# The section name must list the full generative env names: a plain [testenv:new-install] would NOT apply to them
description = Emulate a new installation using wheel, ensuring e.g. that all packages are installed
package = wheel
set_env =
    # A set_env here replaces (not merges with) the top-level one, so re-include it first
    {[testenv]set_env}
    # Empty value overrides the top-level PYTHONPATH so that the installed wheel, not the source tree, is imported
    PYTHONPATH =
# Run from outside the source tree so that the checkout's webchanges/ directory cannot mask a broken wheel
change_dir = {env_tmp_dir}
commands =
   python -c "from airportsdata import __version__; print(__version__)"

[testenv:py{315, 314, 313, 312, 311}-pytest]
# Settings defined in the top-level testenv section are automatically inherited if not overwritten
# The section name must list the full generative env names: a plain [testenv:pytest] would NOT apply to them
description = Run tests
deps =
    -rtests/requirements_testing.txt
set_env =
    # A set_env here replaces (not merges with) the top-level one, so re-include it first
    {[testenv]set_env}
    ; # pytest-cov (parallel = true in pyproject.toml) combines its own parallel data files at session end
    ; # into COVERAGE_FILE, which defaults to plain .coverage — a name `coverage combine` in [testenv:post]
    ; # ignores. Suffix each env's file instead so post can merge coverage across Python versions.
    ; COVERAGE_FILE = {toxinidir}{/}.coverage.{env_name}
; commands = pytest -v --cov=./ --cov-report=term tests/
commands = pytest -v
depends =
    pre-commit
    py{315, 314, 311}-new-install

; [testenv:post]
; description = Post-tests cleanup for coverage
; skip_install = true
; deps =
;     coverage
;     coverage-conditional-plugin
; commands =
;     coverage combine
;     coverage html
;     # TODO The command below works in Windows only
;     cmd /c start "" "file://{toxinidir}/htmlcov/index.html"
; allowlist_externals =
;     cmd
; depends =
;     py{315, 314, 313, 312, 311}-pytest
